<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png?v=3" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=3" />
    <link rel="shortcut icon" href="./favicon.ico?v=3" />
    <link rel="apple-touch-icon" href="./logo.png?v=3" />
    <link rel="manifest" href="./manifest.json" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080c14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pratama Farm" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Sistem Informasi Manajemen Peternakan Bebek Petelur & Akuntansi Keuangan PRATAMA BISNIS GRUP" />

    <title>PRATAMA BISNIS GRUP - SIM Peternakan Bebek Petelur</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => {
              console.log('Service Worker Registered for PRATAMA BISNIS GRUP PWA', reg.scope);
              // Force check for updates every time app opens
              reg.update();
            })
            .catch((err) => {
              console.log('Service Worker Registration Failed', err);
            });
        });

        // Auto reload when new service worker takes control
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
