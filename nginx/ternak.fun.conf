# ==============================================================================
# Nginx Reverse Proxy Configuration untuk domain: ternak.fun
# ==============================================================================
# Petunjuk Pasang di Linux VPS:
# 1. Salin file ini ke: /etc/nginx/sites-available/ternak.fun
#    sudo cp nginx/ternak.fun.conf /etc/nginx/sites-available/ternak.fun
# 2. Buat symlink ke sites-enabled:
#    sudo ln -s /etc/nginx/sites-available/ternak.fun /etc/nginx/sites-enabled/
# 3. Uji konfigurasi & reload Nginx:
#    sudo nginx -t && sudo systemctl reload nginx
# 4. Pasang SSL Gratis (HTTPS) dengan Certbot:
#    sudo certbot --nginx -d ternak.fun -d www.ternak.fun
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ternak.fun www.ternak.fun;

    # Batas ukuran payload request (untuk import data/backup JSON)
    client_max_body_size 20M;

    # Forward semua traffic ke port internal aplikasi (default: 3001)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings untuk polling & streaming
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
